name: aidem_app
description: "AIDEM: Artificial Intelligence Disaster & Emergency Management"
publish_to: 'none'

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.0.0+5

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  flutter_gemma: ^0.14.1
  file_picker: ^9.0.2
  url_launcher: ^6.3.1
  geolocator: ^14.0.2
  speech_to_text: ^7.3.0
  camera: ^0.12.0+1
  sqflite: ^2.4.2+1
  path_provider: ^2.1.5
  google_fonts: ^8.1.0
  shared_preferences: ^2.5.2
  permission_handler: 12.0.0
  image_picker: ^1.1.2
  flutter_tts: ^4.2.5
  vosk_flutter: ^0.3.48
  record: ^6.2.0

dependency_overrides:
  # vosk_flutter 0.3.48 still declares permission_handler ^10.2.0, while the
  # app uses the current permission_handler API across Android and Windows.
  # Keep this override until vosk_flutter widens its dependency constraint.
  permission_handler: 12.0.0
  # Keep the transitive HTTP client on the Dart 3 compatible 1.x line while
  # flutter_gemma and related platform packages finish converging constraints.
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/models/
